# Case study: integrated 6-bus electricity / 3-node district heating system.
#
# This is the AUTHORS' data, taken from the online appendix of Mitridati &
# Taylor (doi:10.5281/zenodo.1195508) and from the initialization script of
# their reference implementation
#   appendix/.../step 1.a initialization MILP MINI 3.py
# See NOTES.md section 2 for the parameter-by-parameter provenance and for the
# places where the appendix PDF and their code disagree.
#
# The DHN nodes and the electricity buses are the SAME six nodes; the heating
# network occupies nodes 1, 2 and 3.

# ---------------------------------------------------------------- constants
constants:
  rho: 1000.0         # water density                       [kg/m3]
  # Their heat equation is Q = 1e-6 * 1.1704 * 3600 * mf * dT, so the effective
  # coefficient is 4.21344e-3 MW.s/(kg.K), i.e. water at 4213 J/(kg.K).
  c: 4.21344e-3       # specific heat capacity              [MJ/(kg.K)] -> Q[MW] = c*mf*dT
  dt: 3600.0          # length of one time step             [s]
  pressure_to_MW: 1.0e-3   # pressures are in kPa; mf*dpr/rho is then kW -> MW

# ------------------------------------------------------- district heating
# Supply direction: node "from" -> node "to". The return pipe of the same
# pair runs "to" -> "from". The network is a line:
#   node 1 (HP1) --pipe 1--> node 2 (CHP1) --pipe 2--> node 3 (HES1, the load)
dhnNodes:
  - id: 1
    TSmin: 363.15     # 90 degC
    TSmax: 393.15     # 120 degC
    TRmin: 303.15     # 30 degC
    TRmax: 333.15     # 60 degC
    prSmin: 50.0      # supply pressure bounds              [kPa]
    prSmax: 5000.0
    prRmin: 50.0      # return pressure bounds              [kPa]
    prRmax: 5000.0
  - id: 2
    TSmin: 363.15
    TSmax: 393.15
    TRmin: 303.15
    TRmax: 333.15
    prSmin: 50.0
    prSmax: 5000.0
    prRmin: 50.0
    prRmax: 5000.0
  - id: 3
    TSmin: 363.15
    TSmax: 393.15
    TRmin: 303.15
    TRmax: 333.15
    prSmin: 50.0
    prSmax: 5000.0
    prRmin: 50.0
    prRmax: 5000.0

pipes:
  - id: 1
    from: 1           # HP node -> CHP node
    to: 2
    R: 0.8            # inner radius                        [m]
    L: 500.0          # length                              [m]
    mu: 20.0          # heat transfer coefficient           [W/(m2.K)]
    phi: 1.93253e-3   # pressure loss coefficient           [kPa/(kg/s)^2]
    mfSmin: 50.0
    mfSmax: 300.0
    mfRmin: 50.0
    mfRmax: 300.0
  - id: 2
    from: 2           # CHP node -> load node
    to: 3
    R: 0.8
    L: 500.0
    mu: 20.0
    phi: 1.93253e-3
    mfSmin: 50.0
    mfSmax: 300.0
    mfRmin: 50.0
    mfRmax: 300.0

# Heat stations. Their heat-only unit HO1 is omitted: its maximum heat output
# is set to zero in their own data, so it can never produce.
heatStations:
  - id: CHP1
    type: chp
    dhnNode: 2
    bus: 2
    Qmax: 100.0       # heat_maxprod['CHP1']                [MW]
    mfmin: 0.0
    mfmax: 301.0
    etaPump: 0.9
  - id: HP1
    type: hp
    dhnNode: 1
    bus: 1
    Qmax: 150.0       # heat_maxprod['HP1']                 [MW]
    mfmin: 0.0
    mfmax: 300.0
    etaPump: 0.9

heatExchangerStations:
  - id: HES1
    dhnNode: 3
    mfmin: 150.0
    mfmax: 300.0
    dprmin: 1000.0    # pr_diff_min                         [kPa]

# ------------------------------------------------------------ electricity
buses: [1, 2, 3, 4, 5, 6]
referenceBus: 1

# B = 1/X with X from their data; fmax in [MW].
lines:
  - {from: 1, to: 2, B: 5.882352941176471,  fmax: 400.0}   # L1, X = 0.170
  - {from: 2, to: 3, B: 27.027027027027028, fmax: 200.0}   # L2, X = 0.037
  - {from: 3, to: 6, B: 3.875968992248062,  fmax: 200.0}   # L3, X = 0.258
  - {from: 6, to: 5, B: 5.076142131979695,  fmax: 200.0}   # L4, X = 0.197
  - {from: 5, to: 4, B: 27.027027027027028, fmax: 200.0}   # L5, X = 0.037
  - {from: 4, to: 1, B: 7.142857142857143,  fmax: 200.0}   # L6, X = 0.140
  - {from: 3, to: 5, B: 55.55555555555556,  fmax: 200.0}   # L7, X = 0.018

electricityGenerators:
  - id: G1
    bus: 6
    Pmax: 180.0
    cost: 11.0        # alpha['G1']                         [$/MWh]
  - id: G2
    bus: 2
    Pmax: 100.0
    cost: 33.0        # alpha['G2']
  - id: W1
    bus: 1
    Pmax: 500.0       # installed capacity, derated hourly by the availability factor
    cost: 0.0001      # alpha['W1'], a token cost to break ties
  - id: CHP1
    bus: 2
    Pmax: 1000.0      # effectively unbounded; the fuel constraint (29) binds instead
    cost: 0.0         # priced through the fuel cost below, Eq. (34)

chpUnits:
  - id: CHP1
    r: 0.6            # r_min, Eq. (28)
    fuelE: 2.4        # rho_elec
    fuelH: 0.25       # rho_heat
    Fmax: 250.0       # CHP_maxprod                         [MW_fuel]
    fuelCost: 12.5    # alpha['CHP1']                       [$/MWh_fuel]

heatPumps:
  - id: HP1
    bus: 1
    LHPmax: 60.0      # Qmax / COP = 150 / 2.5              [MW]

# Electricity load shares, from their elec_load: 20 % at node 3, 40 % at
# node 4, 40 % at node 5. Matches Table V of the appendix.
electricityLoads:
  - {bus: 3, share: 0.20}
  - {bus: 4, share: 0.40}
  - {bus: 5, share: 0.40}
