# Degenerate test system: two DHN nodes, one pipe, one CHP, one heat load.
# Small enough that the optimal dispatch can be worked out by hand - see
# test/runtests.jl for the derivation.

constants:
  rho: 963.0
  c: 4.182e-3
  dt: 3600.0
  pressure_to_MW: 1.0e-6

dhnNodes:
  - {id: 1, TSmin: 343.0, TSmax: 373.0, TRmin: 313.0, TRmax: 333.0, prSmin: 2.0e5, prSmax: 1.6e6, prRmin: 1.0e5, prRmax: 8.0e5}
  - {id: 2, TSmin: 343.0, TSmax: 373.0, TRmin: 313.0, TRmax: 333.0, prSmin: 2.0e5, prSmax: 1.6e6, prRmin: 1.0e5, prRmax: 8.0e5}

pipes:
  - {id: 1, from: 1, to: 2, R: 0.30, L: 5000.0, mu: 1.0, phi: 1.0, mfSmin: 10.0, mfSmax: 900.0, mfRmin: 10.0, mfRmax: 900.0}

heatStations:
  - {id: CHP1, type: chp, dhnNode: 1, bus: 1, Qmax: 200.0, mfmin: 0.0, mfmax: 900.0, etaPump: 0.8}

heatExchangerStations:
  - {id: HES1, dhnNode: 2, mfmin: 0.0, mfmax: 900.0, dprmin: 1.0e5}

buses: [1, 2]
referenceBus: 1

lines:
  - {from: 1, to: 2, B: 100.0, fmax: 200.0}

electricityGenerators:
  - {id: G1, bus: 2, Pmax: 200.0, cost: 30.0}
  - {id: W1, bus: 2, Pmax: 0.0, cost: 0.0}
  - {id: CHP1, bus: 1, Pmax: 150.0, cost: 0.0}

chpUnits:
  - {id: CHP1, r: 0.15, fuelE: 2.857, fuelH: 2.222, Fmax: 2000.0, fuelCost: 12.0}

heatPumps: []

electricityLoads:
  - {bus: 2, share: 1.0}
